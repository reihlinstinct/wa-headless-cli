name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t wa-headless .
      - name: Run unit tests in container
        run: |
          docker run --rm -e NODE_ENV=development --entrypoint sh wa-headless -c \
            "npm install --include=dev && node --test test/"
      - name: Summary
        if: always()
        run: |
          {
            echo "## CI run"
            echo "- Built wa-headless image from Containerfile"
            echo "- Ran node --test unit tests inside the image"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
